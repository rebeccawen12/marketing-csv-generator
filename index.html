<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次月行銷計畫 CSV 產生器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #1e1e25;
    --border: #2e2e38;
    --accent: #7c6af7;
    --accent2: #3de8b0;
    --text: #e8e8f0;
    --muted: #7a7a8c;
    --success: #3de8b0;
    --error: #f77c7c;
    --warn: #f7c574;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100vh; padding: 40px 24px;
  }
  .container { max-width: 880px; margin: 0 auto; }

  header { margin-bottom: 32px; }
  header h1 {
    font-family: var(--mono); font-size: 22px; font-weight: 500;
    color: var(--accent); letter-spacing: 0.04em; margin-bottom: 6px;
  }
  header p { font-size: 13px; color: var(--muted); line-height: 1.6; }

  .step {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px 24px; margin-bottom: 14px;
  }
  .step-label {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .step-num {
    background: var(--accent); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
  }

  .row-inputs { display: flex; gap: 12px; }
  .field { flex: 1; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 6px; font-family: var(--mono);
  }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono);
    font-size: 14px; padding: 10px 14px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }

  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono);
    font-size: 12px; padding: 14px; resize: vertical; outline: none;
    line-height: 1.6; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; font-family: var(--mono); line-height: 1.7; }
  .hint b { color: var(--accent2); font-weight: 500; }

  .game-map { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .game-tag {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 11px;
    font-family: var(--mono); color: var(--muted);
  }
  .game-tag b { color: var(--accent); font-weight: 500; }

  .btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 11px 26px; font-family: var(--mono);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.03em;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-dl { background: var(--accent2); color: #0f0f11; }
  .btn-sample {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; padding: 6px 12px;
  }
  .btn-sample:hover { color: var(--accent); border-color: var(--accent); opacity: 1; }

  #status {
    margin-top: 12px; font-family: var(--mono); font-size: 13px; min-height: 20px;
  }
  .status-ok  { color: var(--success); }
  .status-err { color: var(--error); }
  .status-warn{ color: var(--warn); }

  #preview-wrap { margin-top: 18px; display: none; }
  .preview-title {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  .table-scroll {
    overflow-x: auto; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg);
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--mono);
  }
  th {
    background: var(--surface2); color: var(--accent);
    padding: 8px 12px; text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; font-weight: 500; font-size: 11px;
  }
  td {
    padding: 7px 12px; border-bottom: 1px solid #1f1f28;
    white-space: nowrap; color: var(--text);
  }
  tr:last-child td { border-bottom: none; }
  tr.row-organic td { color: var(--muted); }
  tr.row-new td { color: var(--accent2); }

  .detected-wrap {
    margin-top: 14px; padding: 14px 16px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; display: none;
  }
  .detected-title {
    font-family: var(--mono); font-size: 11px;
    color: var(--accent2); letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px;
    font-family: var(--mono); font-size: 11px;
    color: var(--accent2);
  }

  .actions {
    display: flex; gap: 12px; align-items: center;
    margin-top: 14px; flex-wrap: wrap;
  }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>// 次月行銷計畫 CSV 產生器</h1>
    <p>從 Excel 複製表1原始資料 → 輸入年月 → 自動轉換為次月行銷計畫 CSV</p>
  </header>

  <div class="step">
    <div class="step-label"><span class="step-num">1</span>輸入年月</div>
    <div class="row-inputs">
      <div class="field">
        <label>年份 YEAR</label>
        <input type="number" id="inp-year" value="2026" min="2020" max="2035">
      </div>
      <div class="field">
        <label>月份 MONTH</label>
        <input type="number" id="inp-month" value="5" min="1" max="12">
      </div>
    </div>
  </div>

  <div class="step">
    <div class="toolbar">
      <div class="step-label" style="margin-bottom:0;"><span class="step-num">2</span>貼上表1</div>
      <button class="btn btn-sample" onclick="loadSample()">載入範例</button>
    </div>
    <textarea id="paste-area" rows="10"
      placeholder="從 Excel 選取含表頭的範圍 → Ctrl+C → 在此 Ctrl+V"></textarea>
    <div class="hint">
      讀取欄位：<b>game · 類別 · device · 廣告目標 · 媒體 · area · 欲花總預算 · 月總下載</b><br>
      <b>所有媒體值自動納入</b>，僅排除彙總列（Overall / 整體 / 雙平台 / 廣告ALL）
    </div>
    <div class="game-map">
      <span class="game-tag">game 對照：</span>
      <span class="game-tag">印尼合併 → <b>99</b></span>
      <span class="game-tag">印尼德撲 → <b>38</b></span>
      <span class="game-tag">中文德撲 → <b>19</b></span>
      <span class="game-tag">Wowslots → <b>77</b></span>
    </div>
  </div>

  <div class="step">
    <div class="step-label"><span class="step-num">3</span>產出 CSV</div>
    <div class="actions">
      <button class="btn" onclick="generate()">產生表格</button>
      <button class="btn btn-dl" id="btn-dl" onclick="downloadCSV()" disabled>下載 CSV</button>
    </div>
    <div id="status"></div>

    <div id="preview-wrap">
      <div class="preview-title">
        <span>// 預覽結果</span>
        <span id="row-count"></span>
      </div>
      <div class="table-scroll">
        <table id="preview-table"></table>
      </div>

      <div class="detected-wrap" id="detected-wrap">
        <div class="detected-title">✓ 自動偵測到的媒體</div>
        <div class="chip-list" id="chip-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GAME_MAP = {
  "印尼合併": 99,
  "印尼德撲": 38,
  "中文德撲": 19,
  "Wowslots": 77,
  "wowslots": 77,
  "WowSlots": 77
};

const DEVICE_MAP = { "AN": 0, "IOS": 1, "iOS": 1, "ios": 1 };

const ALWAYS_SKIP_PATTERNS = [
  /Overall$/i, /^整體$/, /^雙平台$/, /^廣告ALL$/i
];

const OUT_COLS = [
  "起始日期","結束日期","平台","遊戲","媒體名稱","廣告活動",
  "國家","優化方式","動能分類","預算","預估安裝數"
];

let csvContent = "";

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function fmtDate(y, m, d) { return y + "/" + m + "/" + d; }
function cleanNum(s) {
  if (s === null || s === undefined) return "";
  const v = String(s).replace(/[\$,\s]/g, "").trim();
  if (v === "" || isNaN(Number(v))) return "";
  return Number(v);
}
function normalizeMedia(s) { return String(s||"").trim().toLowerCase(); }
function isAggregationRow(s) { return ALWAYS_SKIP_PATTERNS.some(re => re.test(s)); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function generate() {
  const raw = document.getElementById('paste-area').value.trim();
  if (!raw) return setStatus("⚠ 請先貼上表1資料", "err");

  const year  = parseInt(document.getElementById('inp-year').value);
  const month = parseInt(document.getElementById('inp-month').value);
  if (!year || !month) return setStatus("⚠ 請填入年份與月份", "err");

  const days  = daysInMonth(year, month);
  const start = fmtDate(year, month, 1);
  const end   = fmtDate(year, month, days);

  const lines = raw.split(/\r?\n/).filter(l => l.length > 0);
  if (lines.length < 2) return setStatus("⚠ 至少需要表頭 + 1 列資料", "err");

  const headers = lines[0].split('\t').map(h => h.trim());
  const idx = {};
  headers.forEach((h, i) => idx[h] = i);

  const needed = ["game","device","廣告目標","媒體","area","欲花總預算","月總下載"];
  const missing = needed.filter(c => !(c in idx));
  if (missing.length) return setStatus("⚠ 缺少必要欄位：" + missing.join("、"), "err");

  const out = [];
  const detectedMedia = new Map();   // 紀錄所有讀到的媒體
  const unknownGames = new Set();
  let lastGame = "", lastDevice = "", lastTarget = "";

  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split('\t');
    const get = name => (cells[idx[name]] ?? "").trim();

    const gameRaw   = get("game")   || lastGame;
    const deviceRaw = get("device") || lastDevice;
    const targetRaw = get("廣告目標") || lastTarget;
    if (get("game"))   lastGame   = get("game");
    if (get("device")) lastDevice = get("device");
    if (get("廣告目標")) lastTarget = get("廣告目標");

    const media = get("媒體");
    if (!media) continue;

    // 只排除彙總列；其他媒體一律自動納入
    if (isAggregationRow(media)) continue;

    const area = get("area");
    const budget = cleanNum(get("欲花總預算"));
    const installs = cleanNum(get("月總下載"));

    const platNum = DEVICE_MAP[deviceRaw];
    if (platNum === undefined) continue;

    // 遊戲對照：找不到則留空並紀錄
    const gameNum = (gameRaw in GAME_MAP) ? GAME_MAP[gameRaw] : "";
    if (gameRaw && !(gameRaw in GAME_MAP)) unknownGames.add(gameRaw);

    const isOrganic = normalizeMedia(media) === "organic";
    let optim = "";
    if (!isOrganic) {
      if (platNum === 1) optim = "安裝";
      else optim = targetRaw;
    }

    detectedMedia.set(media, (detectedMedia.get(media) || 0) + 1);

    out.push({
      "起始日期": start, "結束日期": end,
      "平台": platNum, "遊戲": gameNum,
      "媒體名稱": media, "廣告活動": "",
      "國家": area, "優化方式": optim, "動能分類": "",
      "預算": budget, "預估安裝數": installs,
      _organic: isOrganic,
      _gameRaw: gameRaw
    });
  }

  if (out.length === 0) return setStatus("⚠ 沒有解析到任何有效列", "err");

  // 排序：AN(0) → IOS(1)，Organic 排同平台最後
  out.sort((a, b) => {
    if (a.平台 !== b.平台) return a.平台 - b.平台;
    return (a._organic ? 1 : 0) - (b._organic ? 1 : 0);
  });

  const lines2 = [OUT_COLS.join(",")];
  out.forEach(r => {
    lines2.push(OUT_COLS.map(c => {
      const v = String(r[c] ?? "");
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(","));
  });
  csvContent = "\uFEFF" + lines2.join("\n");

  renderPreview(out);
  showDetected(detectedMedia);

  let msg = "✓ 完成！共 " + out.length + " 列";
  let type = "ok";
  if (unknownGames.size > 0) {
    msg += "（⚠ 未對應到的 game：" + [...unknownGames].join("、") + "，遊戲欄位留空）";
    type = "warn";
  }
  setStatus(msg, type);
  document.getElementById('btn-dl').disabled = false;
  document.getElementById('row-count').textContent = out.length + " rows";
}

function renderPreview(rows) {
  document.getElementById('preview-wrap').style.display = "block";
  const tbl = document.getElementById('preview-table');
  let html = "<thead><tr>" + OUT_COLS.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
  rows.forEach(r => {
    const cls = r._organic ? "row-organic" : "";
    html += '<tr class="' + cls + '">' + OUT_COLS.map(c => {
      const v = r[c];
      return "<td>" + (v === "" || v == null ? "" : escapeHtml(String(v))) + "</td>";
    }).join("") + "</tr>";
  });
  html += "</tbody>";
  tbl.innerHTML = html;
}

function showDetected(detected) {
  const wrap = document.getElementById('detected-wrap');
  const list = document.getElementById('chip-list');
  if (!detected || detected.size === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  list.innerHTML = '';
  const entries = [...detected.entries()].sort((a,b) => b[1] - a[1]);
  for (const [name, count] of entries) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = name + " ×" + count;
    list.appendChild(chip);
  }
}

function downloadCSV() {
  if (!csvContent) return;
  const y = document.getElementById('inp-year').value;
  const m = String(document.getElementById('inp-month').value).padStart(2,'0');
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "次月行銷計畫_" + y + m + ".csv";
  a.click(); URL.revokeObjectURL(url);
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type === "ok" ? "status-ok" : type === "warn" ? "status-warn" : "status-err";
}

function loadSample() {
  const sample = [
    "game\t類別\tdevice\t廣告目標\t媒體\tarea\t欲花總預算\t預算占比\t月總下載",
    "印尼合併\t成效型\tAN\t自然\tOrganic\t\t\t\t27000",
    "\t\t\t含金\tFB\tID\t450000\t27%\t8090",
    "\t\t\t\tTiktok\tID\t912000\t55%\t11055",
    "\t\t\t\tGoogle Ads\tID\t180000\t10%\t3200",
    "\t\t\t\tmoloco_int\tID\t207000\t12%\t6900",
    "\t\t\t\tUnity Ads\tID\t90000\t5%\t1800",
    "\t\t\t\tAppLovin\tID\t60000\t3%\t1200",
    "\t\t\t\tAppsflyer\tID\t13257\t1%\t",
    "\t\t\t\t含金Overall\t\t1582257\t95%\t26045",
    "\t\t\t回流\tFB\tID\t29700\t2%\t149",
    "\t\t\t\tTiktok\tID\t59400\t4%\t322",
    "\t\t\t\tAppsflyer\tTW\t235\t0%\t",
    "\t\t\t\t回流Overall\t\t89100\t5%\t470",
    "\t\tIOS\t自然\tOrganic\t\t\t\t2040",
    "\t\t\t含金\tApple Search Ads\tID\t120000\t80%\t750",
    "\t\t\t\tFB\tID\t30000\t20%\t120",
    "\t\t\t\tAppsflyer\tID\t435\t0%\t",
    "\t\t\t\t安裝Overall\t\t150435\t100%\t870"
  ].join("\n");
  document.getElementById('paste-area').value = sample;
  setStatus("已載入範例（含 Google Ads / Unity Ads / AppLovin 等其他媒體）", "warn");
}
</script>
</body>
</html>
